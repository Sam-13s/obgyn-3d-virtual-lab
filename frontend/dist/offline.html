<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <title>Offline · OB-GYN Virtual Lab</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #eaf1fa; background: #07111f; font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 520px; padding: 28px; border: 1px solid #263b53; border-radius: 18px; background: #101e30; }
      h1 { margin-top: 0; font-size: 1.5rem; }
      p { color: #a9bdca; }
      button { padding: 10px 14px; border: 0; border-radius: 9px; color: #071b25; background: #58d7c1; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The app shell and 3D anatomy asset are cached after opening the lab online. Account verification, signed-in lessons after a reload, progress sync and assessments need a connection to the learning server.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
